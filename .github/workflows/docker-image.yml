name: Build and publish image

on:
    push:
        branches: [main, coolify]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.6.3

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm exec tsc --noEmit

            # Advisory for now: surfaces vulnerable dependencies without blocking deploys.
            - run: pnpm audit --prod --audit-level=high
              continue-on-error: true

    build:
        needs: check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=raw,value=latest
                      type=sha,format=long

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  # NEXT_PUBLIC_* values are inlined at build time; set them as repository variables.
                  build-args: |
                      NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }}
                      NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
                      NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}

            - name: Trigger Coolify deploy
              env:
                  COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
                  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
              run: |
                  if [ -z "$COOLIFY_WEBHOOK" ]; then
                      echo "COOLIFY_WEBHOOK not set, skipping deploy trigger"
                      exit 0
                  fi
                  curl --fail-with-body -sS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
